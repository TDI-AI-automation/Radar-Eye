name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: radar_eye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy (advisory only, does not fail the build)
        continue-on-error: true
        run: mypy .

      - name: Pytest with coverage
        # RADAR_EYE_DB_USER/PASSWORD/ENCRYPTION_KEY are not set here -- the
        # apps/api/tests autouse fixture (_default_env) provides them for
        # every test and always matches this job's postgres service
        # credentials above.
        run: pytest --cov --cov-report=term
