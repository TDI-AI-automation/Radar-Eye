# Live Monitoring's permanent video delivery path (HLS, ADR-031).
#
# Unlike configs/visualization.yaml (an optional RTSP diagnostic feature,
# off by default), this is core Camera Runtime functionality -- a
# connected camera must always be watchable in Live Monitoring, so
# enabled defaults to true.
#
# Overlay appearance (colors, draw_* toggles) is configured once, in
# configs/visualization.yaml, and reused here regardless of whether
# Visualization's own RTSP output is enabled.

enabled: true

# Where hlssink2 writes each camera's segment*.ts + playlist.m3u8 (one
# subdirectory per camera_id). apps.api reads from this same path to
# serve it over HTTP -- keep this in sync with configs/api.yaml (or
# wherever LiveStreamHttpSettings is configured) if you change it.
output_dir: /tmp/radar-eye/hls

output_codec: h264
output_bitrate: 4000000

# Short segments keep glass-to-browser latency low (roughly
# playlist_length * segment_target_duration_seconds).
segment_target_duration_seconds: 2
playlist_length: 3
max_segment_files: 10
