[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
/(
  \.venv
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.10"
exclude = ["\\.venv"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.run]
source = ["apps", "services", "shared"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
